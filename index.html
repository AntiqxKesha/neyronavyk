<style>
/* ============================================================
   Нейронавык — стили (v5 self-contained: доступность + правовое)
   ============================================================ */
:root{
  --bg:#0D0F12; --surface-1:#161A1F; --surface-2:#1E232A;
  --text-primary:#E6EAEF; --text-secondary:#9BA6B2; --text-muted:#77818C;
  --border:#2A313A; --border-soft:#2E3740;
  --accent-blue:#2F6BFF; --accent-blue-light:#5C8DFF;
  --accent-violet:#8B5CF6; --accent-violet-light:#A78BFA;
  --accent-cyan:#22D3EE; --accent-cyan-light:#67E8F9;
  --accent-amber:#F59E0B; --accent-amber-light:#FBBF24;
  --accent-magenta:#EC4899; --accent-magenta-light:#F472B6;
  --accent-green:#34D399;
  --grad-primary:linear-gradient(135deg,var(--accent-blue),var(--accent-violet));
  --glow:0 0 0 1px rgba(47,107,255,.35),0 6px 28px rgba(47,107,255,.32);
  --font-text:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-display:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
  --container:1080px; --shadow-card:0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-text);font-size:16px;line-height:1.6;color:var(--text-primary);background:var(--bg);display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg,video,iframe{display:block;max-width:100%}
a{color:var(--accent-blue);text-decoration:none}
a:hover{color:var(--accent-blue-light)}
::selection{background:rgba(139,92,246,.4)}
:focus-visible{outline:3px solid var(--accent-cyan);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1!important;transform:none!important}
  .attention{animation:none!important}
}
.container{width:100%;max-width:var(--container);margin-inline:auto;padding-inline:16px}
.site-main{flex:1;padding-block:28px 64px}
.skip-link{position:absolute;left:12px;top:-60px;z-index:200;padding:10px 16px;background:var(--grad-primary);color:#fff;border-radius:var(--radius-sm);font-weight:600;transition:top .18s ease}
.skip-link:focus{top:12px;color:#fff}

/* Шапка */
.site-header{position:sticky;top:0;z-index:100;background:rgba(13,15,18,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--text-primary)}
.logo:hover{color:var(--text-primary)}
.logo-icon{width:28px;height:28px;color:var(--accent-blue);filter:drop-shadow(0 0 6px rgba(47,107,255,.55)) drop-shadow(0 0 14px rgba(139,92,246,.35))}
.logo-text{font-family:var(--font-display);font-size:18px;font-weight:700;background:linear-gradient(90deg,#E6EAEF,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.site-nav{display:flex;gap:6px}
.nav-link{padding:8px 12px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:15px;font-weight:500}
.nav-link:hover{color:var(--text-primary);background:var(--surface-1)}
.nav-link.is-active{color:var(--accent-cyan-light)}

/* Кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:1px solid transparent;border-radius:var(--radius-md);font-family:var(--font-text);font-size:15px;font-weight:600;line-height:1.2;cursor:pointer;transition:filter .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease;text-align:center;color:var(--text-primary)}
.btn:hover{color:var(--text-primary)}
.btn-lg{padding:14px 24px;font-size:16px}
.btn-primary{background:var(--grad-primary);color:#fff;box-shadow:var(--glow)}
.btn-primary:hover{filter:brightness(1.12);color:#fff;transform:translateY(-2px);box-shadow:0 0 0 1px rgba(92,141,255,.5),0 8px 34px rgba(92,141,255,.4)}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-ghost:hover{border-color:var(--accent-violet);color:var(--accent-violet-light);background:var(--surface-1);transform:translateY(-2px)}
.btn-danger{background:transparent;border-color:rgba(236,72,153,.55);color:var(--accent-magenta-light)}
.btn-danger:hover{border-color:var(--accent-magenta);background:rgba(236,72,153,.08);color:var(--accent-magenta-light)}
.btn.is-disabled{opacity:.45;pointer-events:none}

/* Hero */
.hero{position:relative;padding-block:40px 8px;max-width:760px;overflow:hidden}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none;z-index:-1}
.hero::before{width:320px;height:320px;top:-80px;right:-60px;background:rgba(139,92,246,.22)}
.hero::after{width:260px;height:260px;top:60px;left:-90px;background:rgba(47,107,255,.16)}
.hero-kicker{display:inline-block;margin-bottom:16px;padding:6px 12px;border:1px solid rgba(139,92,246,.5);border-radius:999px;color:var(--accent-violet-light);background:rgba(139,92,246,.1);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hero-title{font-family:var(--font-display);font-size:clamp(30px,6vw,48px);line-height:1.15;letter-spacing:-.01em;margin-bottom:14px;color:var(--text-primary);background:linear-gradient(90deg,#E6EAEF 0%,#5C8DFF 45%,#A78BFA 75%,#F472B6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-subtitle{color:var(--text-secondary);font-size:17px;margin-bottom:28px;max-width:580px}

/* Заголовки */
.section-title{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.section-head{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}

/* Прогресс */
.progress-block{max-width:340px}
.progress-label{font-size:14px;color:var(--text-secondary);margin-bottom:8px}
.progress-track{height:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent-blue),var(--accent-violet),var(--accent-magenta));border-radius:999px;box-shadow:0 0 14px rgba(139,92,246,.6);transition:width .5s cubic-bezier(.22,.8,.36,1)}

/* Шаги */
.steps-section,.lectures-section{margin-top:56px}
.steps-list{list-style:none;display:grid;gap:14px;margin-top:20px}
.step{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:transform .18s ease,border-color .18s ease}
.step:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.5)}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--grad-primary);color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;margin-bottom:12px;box-shadow:0 0 12px rgba(139,92,246,.45)}
.step h3{font-family:var(--font-display);font-size:17px;margin-bottom:6px}
.step p{color:var(--text-secondary);font-size:15px}

/* Карточки */
.lecture-grid{list-style:none;display:grid;grid-template-columns:1fr;gap:14px}
.lecture-card{--acc:var(--accent-blue);--acc-light:var(--accent-blue-light);--acc-border:rgba(47,107,255,.45);position:relative;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;height:100%;display:flex;flex-direction:column;gap:12px;overflow:hidden;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card-strip{position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc-light));opacity:.85}
.lecture-card.accent-cyan{--acc:var(--accent-cyan);--acc-light:var(--accent-cyan-light);--acc-border:rgba(34,211,238,.45)}
.lecture-card.accent-amber{--acc:var(--accent-amber);--acc-light:var(--accent-amber-light);--acc-border:rgba(245,158,11,.45)}
.lecture-card.accent-violet{--acc:var(--accent-violet);--acc-light:var(--accent-violet-light);--acc-border:rgba(139,92,246,.5)}
.lecture-card.accent-magenta{--acc:var(--accent-magenta);--acc-light:var(--accent-magenta-light);--acc-border:rgba(236,72,153,.45)}
.lecture-card:hover{transform:translateY(-3px);border-color:var(--acc-border);box-shadow:0 12px 36px rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.25),0 0 0 1px var(--acc-border)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-num{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--acc-light)}
.card-title{font-size:17px;line-height:1.35}
.card-link{color:var(--text-primary)}
.card-link:hover{color:var(--acc-light)}
.card-duration{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:14px;margin-top:auto}
.card-duration svg{color:var(--acc-light)}
.lecture-card.is-done{opacity:.7}
.lecture-card.is-done .card-strip{background:linear-gradient(90deg,var(--accent-green),#6EE7B7)}
.lecture-card.is-watched{opacity:.88}
.lecture-card.is-locked{opacity:.58;filter:grayscale(.45)}
.lecture-card.is-locked:hover{transform:none;border-color:var(--border);box-shadow:none}
.lecture-card.is-locked .card-strip{opacity:.3}
.lecture-card.is-locked .card-title{color:var(--text-secondary)}
.lock-hint{color:var(--text-secondary);font-size:13px;margin-top:auto}
.badge svg{flex-shrink:0}

/* Чипы */
.tool-chips{display:flex;flex-wrap:wrap;gap:6px}
.tool-chip{--chip-bg:rgba(47,107,255,.12);--chip-border:rgba(47,107,255,.45);--chip-fg:var(--accent-blue-light);display:inline-flex;align-items:center;padding:3px 10px;border:1px solid var(--chip-border);border-radius:999px;background:var(--chip-bg);color:var(--chip-fg);font-size:12px;font-weight:600;white-space:nowrap}
.tool-chip.chip-chatgpt{--chip-bg:rgba(34,211,238,.1);--chip-border:rgba(34,211,238,.4);--chip-fg:var(--accent-cyan-light)}
.tool-chip.chip-claude{--chip-bg:rgba(245,158,11,.1);--chip-border:rgba(245,158,11,.4);--chip-fg:var(--accent-amber-light)}
.tool-chip.chip-leonardo{--chip-bg:rgba(139,92,246,.14);--chip-border:rgba(139,92,246,.5);--chip-fg:var(--accent-violet-light)}
.tool-chip.chip-all{--chip-bg:rgba(47,107,255,.12);--chip-border:rgba(47,107,255,.45);--chip-fg:var(--accent-blue-light)}

/* Бейджи */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.badge-accent{color:var(--accent-cyan-light);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.badge-warn{color:var(--accent-amber-light);border-color:rgba(245,158,11,.45);background:rgba(245,158,11,.08)}
.badge-solid{color:#fff;background:var(--grad-primary);border-color:transparent;box-shadow:0 0 10px rgba(139,92,246,.4)}

/* Страница лекции */
.back-link{display:inline-flex;align-items:center;gap:6px;margin-bottom:20px;color:var(--text-secondary);font-size:15px;font-weight:500}
.back-link:hover{color:var(--accent-blue-light)}
.lecture-meta{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.lecture-title{font-family:var(--font-display);font-size:clamp(24px,4.5vw,36px);line-height:1.2;letter-spacing:-.01em;margin-bottom:10px}
.lecture-desc{color:var(--text-secondary);max-width:720px}
.lecture-duration{color:var(--text-secondary);font-size:14px}
.lecture-duration svg{color:var(--accent-violet-light)}
.video-frame{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-top:28px;box-shadow:0 0 0 1px rgba(34,211,238,.12),0 14px 40px rgba(0,0,0,.45)}
.video-frame iframe,.video-frame video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-placeholder{margin-top:28px;background:linear-gradient(180deg,var(--surface-1),var(--surface-2));border:1px dashed rgba(139,92,246,.45);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.ph-icon{color:var(--accent-violet-light);opacity:.9;filter:drop-shadow(0 0 10px rgba(139,92,246,.5))}
.ph-text{font-family:var(--font-display);font-size:18px;font-weight:600;margin-top:8px}
.ph-note{color:var(--text-secondary);font-size:14px}

/* Вкладки */
.lecture-body{margin-top:36px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}
.tab{appearance:none;background:transparent;border:none;border-bottom:2px solid transparent;padding:10px 14px;font-family:var(--font-text);font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:color .18s ease,border-color .18s ease}
.tab:hover{color:var(--text-primary)}
.tab.is-active{color:var(--accent-cyan-light);border-bottom-color:var(--accent-cyan)}
.tab-panel{padding-bottom:8px}
.materials-list{list-style:none;display:grid;gap:10px}
.material-link{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-weight:500;transition:border-color .18s ease,transform .18s ease}
.material-link:hover{border-color:var(--accent-violet);color:var(--accent-violet-light);transform:translateY(-2px)}
.material-link svg{color:var(--accent-violet-light);flex-shrink:0}
.empty-note{color:var(--text-secondary);padding:16px 0}
.homework-text{margin-bottom:20px}
.homework-actions{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.hint{color:var(--text-secondary);font-size:14px}
.lecture-actions{margin-top:32px}
.lecture-nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:28px;padding-top:24px;border-top:1px solid var(--border)}

/* Опрос */
.survey-section{margin-top:40px;background:linear-gradient(180deg,var(--surface-1),var(--surface-2));border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px}
.survey-section h2{font-family:var(--font-display);font-size:20px;margin-bottom:4px}
.survey-intro{color:var(--text-secondary);font-size:14px;margin-bottom:20px}
.survey-field{margin-bottom:18px}
.survey-field>label,.survey-label{display:block;font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.survey-label .req{color:var(--accent-magenta-light)}
.stars{display:inline-flex;gap:6px}
.star{appearance:none;background:transparent;border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;color:var(--text-secondary);line-height:0;transition:border-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease}
.star:hover{transform:translateY(-2px);color:var(--accent-amber-light);border-color:var(--accent-amber)}
.star.is-active{color:var(--accent-amber);border-color:var(--accent-amber);box-shadow:0 0 10px rgba(245,158,11,.35)}
.seg-group{display:flex;flex-wrap:wrap;gap:8px}
.seg{appearance:none;background:transparent;border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-family:var(--font-text);font-size:14px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:border-color .18s ease,color .18s ease,background .18s ease}
.seg:hover{border-color:var(--accent-violet);color:var(--accent-violet-light)}
.seg.is-active{background:rgba(139,92,246,.16);border-color:var(--accent-violet);color:var(--accent-violet-light)}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;background:transparent;border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-family:var(--font-text);font-size:13.5px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:border-color .18s ease,color .18s ease,background .18s ease}
.chip:hover{border-color:var(--accent-cyan);color:var(--accent-cyan-light)}
.chip.is-selected{background:rgba(34,211,238,.12);border-color:var(--accent-cyan);color:var(--accent-cyan-light)}
.input-text{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;font-family:var(--font-text);font-size:15px;color:var(--text-primary);resize:vertical;min-height:80px;transition:border-color .18s ease,box-shadow .18s ease}
.input-text::placeholder{color:var(--text-muted)}
.input-text:focus{outline:none;border-color:var(--accent-violet);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.survey-submit{margin-top:8px}
.field-error{display:block;color:var(--accent-magenta-light);font-size:13px;margin-top:6px;min-height:0}
.consent-line{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--text-secondary);margin:14px 0 4px}
.consent-line input{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:var(--accent-violet)}
.consent-line a{color:var(--accent-blue-light)}
.survey-success{text-align:center;padding:12px 0 4px}
.survey-success .check-circle{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.45);color:var(--accent-green);display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(52,211,153,.25)}
.survey-success h3{font-family:var(--font-display);font-size:18px;margin-bottom:6px}
.survey-success p{color:var(--text-secondary);font-size:14px}
.attention{animation:attentionPulse 1.6s ease 2}
@keyframes attentionPulse{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,0)}50%{box-shadow:0 0 0 4px rgba(47,107,255,.55)}}

/* Страница «О курсе» */
.page-title{font-family:var(--font-display);font-size:clamp(28px,5vw,40px);margin-bottom:12px;background:linear-gradient(90deg,#E6EAEF,#5C8DFF 55%,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.page-lead{color:var(--text-secondary);max-width:660px}
.about-section{margin-top:44px}
.format-list{list-style:none;display:grid;gap:10px;margin-top:16px}
.format-list li{display:flex;gap:12px;align-items:flex-start;padding:16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-secondary)}
.format-list li::before{content:'';flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--grad-primary);margin-top:8px;box-shadow:0 0 8px rgba(139,92,246,.6)}
.program-list{list-style:none;display:grid;gap:10px;margin-top:16px}
.program-link{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);transition:border-color .18s ease,transform .18s ease}
.program-link:hover{border-color:var(--accent-violet);transform:translateY(-2px);color:var(--text-primary)}
.program-num{font-family:var(--font-display);font-weight:700;color:var(--accent-violet-light);font-size:14px;flex-shrink:0}
.program-title{font-weight:500;flex:1}
.program-duration{color:var(--text-secondary);font-size:14px;flex-shrink:0;display:inline-flex;align-items:center;gap:6px}
.program-duration svg{color:var(--accent-amber-light)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.stat-card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px}
.stat-value{font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.01em;background:linear-gradient(90deg,var(--accent-blue-light),var(--accent-violet-light));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-label{color:var(--text-secondary);font-size:13.5px;line-height:1.45;margin-top:4px}
.survey-note{color:var(--text-secondary);font-size:13px;margin-top:10px}
.usp-card{margin-top:16px;padding:22px;border-radius:var(--radius-lg);background:linear-gradient(135deg,rgba(47,107,255,.14),rgba(139,92,246,.16));border:1px solid rgba(139,92,246,.45)}
.usp-card p{font-size:17px;font-weight:600;line-height:1.5}
.check-list{list-style:none;display:grid;gap:10px;margin-top:16px}
.check-list li{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-secondary);font-size:15px}
.check-list svg{color:var(--accent-green);flex-shrink:0;margin-top:2px}
.check-list strong{color:var(--text-primary);display:block;margin-bottom:2px}
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.team-card{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md)}
.team-avatar{width:42px;height:42px;border-radius:50%;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;box-shadow:0 0 12px rgba(139,92,246,.4);flex-shrink:0}
.team-name{font-weight:600;font-size:15px}
.cmp-table{margin-top:16px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cmp-row{display:grid;grid-template-columns:1fr}
.cmp-head .cmp-cell{background:var(--surface-2);font-weight:600;color:var(--text-primary);font-size:13.5px;text-transform:uppercase;letter-spacing:.04em}
.cmp-cell{padding:12px 14px;font-size:14px;color:var(--text-secondary);border-top:1px solid var(--border)}
.cmp-head .cmp-cell{border-top:none}
.cmp-cell strong{color:var(--text-primary)}
.cmp-cell.diff{color:var(--accent-cyan-light)}
.risk-list .risk-arrow{color:var(--accent-violet-light);flex-shrink:0}
.meta-note{color:var(--text-secondary);font-size:14px;margin-top:10px}

/* Правовая страница */
.legal-section{margin-top:36px;max-width:820px}
.legal-card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-top:16px}
.legal-card h2{font-family:var(--font-display);font-size:20px;margin-bottom:10px}
.legal-card h3{font-family:var(--font-display);font-size:16px;margin:16px 0 8px}
.legal-card p,.legal-card li{color:var(--text-secondary);font-size:15px}
.legal-card ul{padding-left:20px;margin:8px 0;display:grid;gap:6px}
.legal-card a{color:var(--accent-blue-light)}
.legal-card .small{font-size:13px;color:var(--text-muted)}
.delete-zone{border-color:rgba(236,72,153,.4);background:rgba(236,72,153,.05)}
.delete-zone h2{color:var(--accent-magenta-light)}
.delete-aside{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}

/* Заблокированный урок */
.locked-page{max-width:640px;padding:40px 0 20px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.locked-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.5);color:var(--accent-amber-light);box-shadow:0 0 18px rgba(245,158,11,.25)}
.locked-icon svg{width:30px;height:30px}
.locked-title{font-family:var(--font-display);font-size:clamp(22px,4vw,30px);line-height:1.2;letter-spacing:-.01em}
.locked-text{color:var(--text-secondary);font-size:15px}
.locked-prev{margin-top:8px;padding:18px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:10px}
.locked-prev p{color:var(--text-secondary);font-size:14px}

/* Cookie-баннер */
.cookie-banner{position:fixed;left:16px;right:16px;bottom:16px;z-index:300;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:0 16px 48px rgba(0,0,0,.55);max-width:520px;margin-left:auto;margin-right:auto;display:flex;flex-direction:column;gap:14px}
.cookie-banner p{font-size:14px;color:var(--text-secondary)}
.cookie-banner .cookie-actions{display:flex;flex-wrap:wrap;gap:10px}

/* Футер */
.site-footer{border-top:1px solid var(--border);padding-block:24px}
.footer-inner{display:flex;flex-direction:column;gap:12px}
.footer-copy{color:var(--text-secondary);font-size:14px}
.footer-contacts{font-style:normal;color:var(--text-secondary);font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.footer-contacts a{color:var(--accent-blue-light)}
.footer-contacts a:hover{color:var(--accent-cyan-light)}
.footer-links{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.footer-links a{color:var(--text-secondary)}
.footer-links a:hover{color:var(--accent-cyan-light)}

/* Анимация появления */
.reveal{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
.reveal.in-view{opacity:1;transform:none}

/* Тост */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:400;background:var(--surface-2);border:1px solid var(--accent-green);border-radius:var(--radius-md);padding:12px 20px;font-size:14px;font-weight:600;color:var(--text-primary);box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:640px){
  .container{padding-inline:24px}
  .lecture-grid{grid-template-columns:repeat(2,1fr)}
  .steps-list{grid-template-columns:repeat(3,1fr)}
  .section-head{flex-direction:row;align-items:center;justify-content:space-between}
  .footer-inner{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
  .survey-section{padding:28px}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .team-grid{grid-template-columns:repeat(3,1fr)}
  .cookie-banner{bottom:24px;left:auto;right:24px;margin:0}
}
@media (min-width:720px){
  .cmp-row{grid-template-columns:1.2fr 1.4fr 1.6fr}
  .cmp-cell{border-top:none;border-left:1px solid var(--border)}
  .cmp-cell:first-child{border-left:none}
}
@media (min-width:920px){
  .lecture-grid{grid-template-columns:repeat(3,1fr)}
  .hero{padding-block:64px 8px}
  .site-main{padding-block:40px 80px}
}

/* v6: тест, курсовая, мобильная навигация, правовые разделы */
.hero{overflow:visible}
.site-main{overflow-x:clip}
[tabindex="-1"]:focus{outline:none}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px}
.age-mark{display:inline-block;margin-right:6px;padding:1px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:700;color:var(--text-primary)}
.extra-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:20px}
.extra-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--text-primary);transition:transform .18s ease,border-color .18s ease}
.extra-card:hover{transform:translateY(-3px);border-color:rgba(139,92,246,.5);color:var(--text-primary)}
.extra-card h3{font-family:var(--font-display);font-size:18px}
.extra-card p{color:var(--text-secondary);font-size:15px}
.note-card{margin:20px 0;padding:16px 18px;background:var(--surface-1);border:1px solid var(--border);border-left:3px solid var(--accent-cyan);border-radius:var(--radius-md);color:var(--text-secondary);font-size:15px}
.note-card a{color:var(--accent-blue-light)}
.test-form{display:grid;gap:14px;margin-top:8px}
.q-card{border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;background:var(--surface-1);display:grid;gap:8px;min-width:0}
.q-card.is-missing{border-color:var(--accent-magenta)}
.q-card legend{font-weight:600;font-size:16px;line-height:1.45;padding:0 4px;color:var(--text-primary)}
.q-num{display:block;font-size:12.5px;font-weight:600;color:var(--accent-violet-light);margin-bottom:4px}
.q-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;color:var(--text-secondary);font-size:15px;transition:border-color .18s ease,background .18s ease}
.q-opt:hover{border-color:var(--accent-violet)}
.q-opt input{width:18px;height:18px;margin-top:3px;flex-shrink:0;accent-color:var(--accent-violet)}
.q-opt:has(input:checked){border-color:var(--accent-violet);background:rgba(139,92,246,.12);color:var(--text-primary)}
.result-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:8px}
.result-card{padding:20px;background:linear-gradient(135deg,rgba(47,107,255,.14),rgba(139,92,246,.16));border:1px solid rgba(139,92,246,.45);border-radius:var(--radius-lg)}
.result-title{font-weight:600;color:var(--text-secondary);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.result-score{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1.1;margin-top:6px}
.result-score span{font-size:18px;color:var(--text-secondary);font-weight:600}
.result-level{color:var(--accent-cyan-light);font-weight:600;margin-bottom:10px}
.result-by{list-style:none;display:grid;gap:4px;font-size:14px;color:var(--text-secondary)}
.result-by li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--border);padding-top:4px}
.key-title{margin-top:32px}
.key-list{display:grid;gap:12px;margin-top:16px;padding-left:22px}
.key-list li{padding:14px 16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-secondary);font-size:14.5px}
.key-list li.is-ok{border-left:3px solid var(--accent-green)}
.key-list li.is-bad{border-left:3px solid var(--accent-magenta)}
.key-q{color:var(--text-primary);font-weight:600;margin-bottom:6px}
.key-e{margin-top:6px;font-size:13.5px}
.final-steps{display:grid;gap:10px;margin-top:16px;padding-left:22px;color:var(--text-secondary)}
.final-steps li{padding-left:4px}
.final-steps strong{color:var(--text-primary)}
.final-steps a{color:var(--accent-blue-light)}
.metric-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.metric{padding:14px 16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md)}
.metric-name{font-weight:600;font-size:14.5px}
.metric-formula{color:var(--text-secondary);font-size:14px;margin-top:4px}
.metric-value{font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:4px;color:var(--accent-cyan-light)}
.calc{display:grid;gap:12px;margin-top:16px}
.calc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md)}
.calc-row label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--text-secondary);min-width:0}
.calc-row label:first-child{grid-column:1 / -1}
.calc-row-short label:first-child{grid-column:auto}
.input-line{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--font-text);font-size:15px;color:var(--text-primary)}
.input-line:focus{outline:none;border-color:var(--accent-violet);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
.calc-out{margin-bottom:16px}
.rubric{width:100%;border-collapse:collapse;margin-top:16px;font-size:14.5px}
.rubric th,.rubric td{padding:10px 12px;border:1px solid var(--border);text-align:left;vertical-align:top;color:var(--text-secondary)}
.rubric th{background:var(--surface-2);color:var(--text-primary)}
.rubric .num{text-align:right;white-space:nowrap;width:70px}
.rubric .total td{color:var(--text-primary);font-weight:700}
.legal-section{scroll-margin-top:84px}
.legal-toc{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:16px;font-size:14px}
.legal-toc a{color:var(--accent-blue-light)}
.survey-bot{margin-top:14px}
@media (max-width:719px){
  .header-inner{flex-direction:column;align-items:flex-start;gap:6px;padding-block:10px}
  .site-nav{width:100%;flex-wrap:wrap;gap:2px 4px;margin-left:-8px}
  .nav-link{white-space:nowrap;padding:5px 8px;font-size:14px}
}
@media (min-width:640px){
  .extra-grid{grid-template-columns:repeat(2,1fr)}
  .result-grid{grid-template-columns:repeat(2,1fr)}
  .metric-grid{grid-template-columns:repeat(2,1fr)}
  .calc-row{grid-template-columns:2fr 1fr 1fr 1fr}
  .calc-row label:first-child{grid-column:auto}
}
@media (min-width:920px){
  .metric-grid{grid-template-columns:repeat(3,1fr)}
}

/* v8: материалы к уроку (приподнятая плашка) */
.mat-card{position:relative;margin:36px 0 28px;padding:26px 26px 24px;border-radius:20px;border:1px solid rgba(139,92,246,.45);
  background:linear-gradient(180deg,rgba(139,92,246,.10),rgba(47,107,255,.05) 38%,var(--surface-1) 100%);
  box-shadow:0 0 0 1px rgba(47,107,255,.18),0 24px 60px rgba(8,10,20,.65),0 10px 40px rgba(139,92,246,.18);transform:translateY(-4px)}
.mat-card::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:2px;border-radius:2px;background:var(--grad-primary)}
.mat-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mat-ico{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--grad-primary);color:#fff;box-shadow:var(--glow)}
.mat-ico svg{width:22px;height:22px}
.mat-kicker{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-cyan-light)}
.mat-head h2{font-family:var(--font-display);font-size:22px;line-height:1.25;margin-top:2px}
.mat-tabs{display:flex;gap:6px;padding:5px;background:var(--bg);border:1px solid var(--border);border-radius:14px;margin-bottom:20px;overflow-x:auto}
.mat-tab{appearance:none;flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:none;border-radius:10px;background:transparent;font-family:var(--font-text);font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:background .18s ease,color .18s ease}
.mat-tab:hover{color:var(--text-primary)}
.mat-tab:focus-visible,.mat-copy:focus-visible,.mat-pre:focus-visible{outline:2px solid var(--accent-cyan);outline-offset:2px}
.mat-tab.is-active{background:var(--grad-primary);color:#fff;box-shadow:0 6px 20px rgba(47,107,255,.35)}
.mat-badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px;font-weight:700;line-height:1.5}
.mat-tab:not(.is-active) .mat-badge{background:var(--surface-2);color:var(--text-secondary)}
.mat-panel[hidden]{display:none}
.mat-idea{padding:14px 16px;margin-bottom:16px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.28);border-left:3px solid var(--accent-cyan);border-radius:var(--radius-md);color:var(--text-primary);font-size:15.5px}
.mat-notes{list-style:none;counter-reset:mn;display:grid;gap:10px}
.mat-notes li{counter-increment:mn;position:relative;display:grid;gap:3px;padding:14px 16px 14px 58px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md)}
.mat-notes li::before{content:counter(mn);position:absolute;left:16px;top:14px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.5);color:var(--accent-violet-light);font-weight:700;font-size:14px}
.mat-note-title{font-weight:700;font-size:15.5px;color:var(--text-primary)}
.mat-note-text{color:var(--text-secondary);font-size:15px}
.mat-prompts{display:grid;gap:14px}
.mat-prompt{padding:16px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);min-width:0}
.mat-prompt header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mat-prompt h3{font-family:var(--font-display);font-size:17px}
.mat-copy{padding:8px 14px;font-size:14px}
.mat-when{margin:6px 0 12px;color:var(--text-secondary);font-size:14.5px}
.mat-pre{margin:0;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}
.mat-var{color:var(--accent-amber-light);background:rgba(245,158,11,.12);border-radius:4px;padding:0 3px}
.mat-foot{margin-top:14px;color:var(--text-muted);font-size:13.5px}
.mat-progress{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.mat-bar{flex:1 1 160px;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.mat-bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-cyan),var(--accent-violet));transition:width .3s ease}
.mat-count{font-size:14px;font-weight:600;color:var(--text-secondary)}
.mat-reset{padding:7px 12px;font-size:13.5px}
.mat-group{border:none;display:grid;gap:8px;margin-bottom:16px;min-width:0}
.mat-group legend{font-weight:700;font-size:15px;margin-bottom:8px;color:var(--accent-violet-light);padding:0}
.mat-check{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;color:var(--text-secondary);font-size:15px;transition:border-color .18s ease,background .18s ease}
.mat-check:hover{border-color:var(--accent-violet)}
.mat-check input{position:absolute;opacity:0;width:1px;height:1px}
.mat-box{flex-shrink:0;display:grid;place-items:center;width:22px;height:22px;margin-top:1px;border:2px solid var(--border-soft);border-radius:6px;transition:background .18s ease,border-color .18s ease}
.mat-check input:focus-visible + .mat-box{outline:2px solid var(--accent-cyan);outline-offset:2px}
.mat-check input:checked + .mat-box{background:var(--accent-green);border-color:var(--accent-green)}
.mat-check input:checked + .mat-box::after{content:"";width:6px;height:11px;margin-top:-2px;border:solid #06241a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.mat-check.is-on{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.4);color:var(--text-primary)}
.hw-card{margin:0 0 28px;padding:22px 24px;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-lg)}
.hw-title{font-family:var(--font-display);font-size:20px;margin-bottom:10px}
@media (max-width:719px){
  .mat-card{padding:20px 14px 18px;border-radius:16px}
  .mat-head h2{font-size:18px}
  .mat-tab{padding:9px 8px;font-size:14px;gap:5px}
  .mat-notes li{padding:12px 12px 12px 50px}
  .mat-notes li::before{left:12px;top:12px}
  .mat-pre{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){.mat-card{transform:none}.mat-bar span{transition:none}}
</style>

<body>

<a class="skip-link" href="#main" data-action="skip">Перейти к содержимому</a>

<header class="site-header">
  <div class="container header-inner">
    <a href="#/" class="logo" aria-label="Нейронавык — на главную">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="2.6"></circle>
        <circle cx="4.5" cy="5.5" r="1.6"></circle>
        <circle cx="19.5" cy="5.5" r="1.6"></circle>

/* Отметки в чек-листах хранятся только в браузере */
var CHECKS_KEY = 'neuroskill_checks_v1';
function loadChecks(){
  try { return JSON.parse(localStorage.getItem(CHECKS_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function saveChecks(data){
  try { localStorage.setItem(CHECKS_KEY, JSON.stringify(data)); } catch(e){}
}
function checksTotal(m){
  var n = 0; m.checks.forEach(function(g){ n += g.items.length; }); return n;
}
function checksDone(id, m){
  var d = loadChecks()[id] || {}, n = 0;
  m.checks.forEach(function(g, gi){ g.items.forEach(function(_, ii){ if(d[gi + '-' + ii]) n++; }); });
  return n;
}

/* Подсветка переменных [в скобках] в шаблоне запроса */
function promptHtml(text){
  return esc(text).replace(/\[([^\]]+)\]/g, '<span class="mat-var">[$1]</span>');
}

function materialsPanel(lecture){
  var m = MATERIALS[lecture.id];
  if(!m) return materialsList(lecture);
  var id = lecture.id;

  var notes = '<ol class="mat-notes">' + m.notes.map(function(n){
    return '<li><span class="mat-note-title">' + esc(n[0]) + '</span><span class="mat-note-text">' + esc(n[1]) + '</span></li>';
  }).join('') + '</ol>';

  var prompts = '<div class="mat-prompts">' + m.prompts.map(function(p, i){
    return '<article class="mat-prompt">' +
      '<header><h3>' + esc(p.title) + '</h3>' +
      '<button type="button" class="btn btn-ghost mat-copy" data-action="copy-prompt" data-lesson="' + id + '" data-idx="' + i + '">' + ICONS.doc + 'Копировать</button></header>' +
      '<p class="mat-when">' + esc(p.when) + '</p>' +
      '<pre class="mat-pre" tabindex="0" aria-label="Шаблон запроса: ' + esc(p.title) + '">' + promptHtml(p.text) + '</pre>' +
    '</article>';
  }).join('') + '</div>' +

function activateMatTab(name){
  var card = document.querySelector('.mat-card');
  if(!card) return;
  card.querySelectorAll('.mat-tab').forEach(function(b){
    var on = b.dataset.mtab === name;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-selected', String(on));
    b.tabIndex = on ? 0 : -1;
  });
  card.querySelectorAll('.mat-panel').forEach(function(p){ p.hidden = p.id !== 'mpanel-' + name; });
}
function updateMatProgress(id){

/* ---------- 3. Хранилище ---------- */
var STORAGE_KEY = 'neuroskill_progress_v2';
var COOKIE_KEY = 'neuroskill_cookie_consent_v1';
var appEl = document.getElementById('app');

function readProgress(){
  try { var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function writeProgress(data){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e){}
}
var progress = readProgress();

function getProgress(id){ return progress[id] || {}; }
function isLessonCompleted(id){ var p = getProgress(id); return !!(p.survey || p.homeworkDone); }
function isLessonUnlocked(id){ return id <= 1 || isLessonCompleted(id - 1); }

function toggleWatched(id){
  var p = getProgress(id); p.watched = !p.watched; progress[id] = p; writeProgress(progress);
}
function markWatched(id){
  var p = getProgress(id);
  if(!p.watched){ p.watched = true; progress[id] = p; writeProgress(progress); updateLectureUI(parseHash()); }
}
function toggleHomeworkDone(id){
  var p = getProgress(id); p.homeworkDone = !p.homeworkDone; progress[id] = p; writeProgress(progress);
}
function saveSurvey(id, data){
  var p = getProgress(id); p.survey = data; progress[id] = p; writeProgress(progress);
}

/* ---------- 6. Экранирование (защита от XSS при будущем контенте) ---------- */
function esc(str){
  return String(str).replace(/[&<>"']/g, function(ch){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch];
  });
}

/* ---------- 7. Тема урока ---------- */
function tagChip(l){
  return '<div class="tool-chips"><span class="tool-chip chip-all">' + esc(l.tag || '') + '</span></div>';
}
/* Безопасные ссылки: только https или относительный путь внутри сайта */
function isSafeUrl(u, allowRelative){
  u = String(u || '').trim();
  if(/^https:\/\/[^\s"'<>]+$/i.test(u)) return true;
  return !!allowRelative && /^[\w\-.\/]+$/.test(u) && u.indexOf('..') === -1 && u.charAt(0) !== '/';
}
var ACCENTS = ['accent-blue','accent-cyan','accent-amber','accent-violet','accent-magenta'];
function accentFor(l){ return ACCENTS[(l.id - 1) % ACCENTS.length]; }

/* ---------- 8. Плеер ---------- */
function placeholderHtml(text, note, live){
  return '<div class="player-placeholder reveal' + (live ? ' in-view' : '') + '" role="img" aria-label="' + esc(text) + '">' +
    '<span class="ph-icon">' + ICONS.play + '</span>' +
    '<p class="ph-text">' + esc(text) + '</p>' +
    (note ? '<p class="ph-note">' + esc(note) + '</p>' : '') +
  '</div>';
}
function buildPlayer(lecture){
  var url = String(lecture.videoUrl || '').trim();
  var soon = placeholderHtml('Видео скоро появится', 'Урок появится здесь после публикации.');
  if(!url) return soon;
  var type = lecture.videoType || 'mp4';
  var titleAttr = 'Видеоурок ' + lecture.id + ': ' + esc(lecture.title);
  var frame = function(src){
    return '<div class="video-frame reveal"><iframe src="' + esc(src) + '" title="' + titleAttr + '" loading="lazy"' +
      ' allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>';
  };
  if(type === 'mp4'){
    if(!isSafeUrl(url, true)) return soon;
    return '<div class="video-frame reveal">' +
      '<video controls preload="metadata" playsinline aria-label="' + titleAttr + '">' +
      '<source src="' + esc(url) + '" type="video/mp4">' +
      'Ваш браузер не поддерживает встроенное видео.' +
      '</video></div>';
  }
  if(type === 'youtube'){
    var m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    return m ? frame('https://www.youtube.com/embed/' + m[1]) : soon;
  }
  if(type === 'vk'){
    return /^https:\/\/(vk\.com|vkvideo\.ru)\/video_ext\.php\?/i.test(url) ? frame(url) : soon;
  }
  if(type === 'rutube'){
    if(/^https:\/\/rutube\.ru\/play\/embed\/[\w-]+/i.test(url)) return frame(url);
    if(/^[\w-]+$/.test(url)) return frame('https://rutube.ru/play/embed/' + url);
    return soon;
  }
  return soon;
}

function buildLectureNav(route){
  var completed = isLessonCompleted(route.id);
  var prevBtn = route.id > 1
    ? '<a class="btn btn-ghost" href="#/lecture/' + (route.id - 1) + '">← Предыдущая</a>'
    : '<span class="btn btn-ghost is-disabled" aria-disabled="true">← Предыдущая</span>';
  var nextBtn;
  if(route.id >= LECTURES.length){
    nextBtn = '<span class="btn btn-ghost is-disabled" aria-disabled="true">Следующая →</span>';
  } else if(!completed){
    nextBtn = '<span class="btn btn-ghost is-disabled" aria-disabled="true" ' +
      'title="Сначала ответьте на опрос после этого урока">Следующая →</span>';
  } else {
    nextBtn = '<a class="btn btn-ghost" href="#/lecture/' + (route.id + 1) + '">Следующая →</a>';
  }
  return prevBtn + nextBtn;
}

function renderLecture(route){

/* ---------- 13а. Входной и итоговый тест ---------- */
var TESTS_KEY = 'neuroskill_tests_v1';
var FINAL_KEY = 'neuroskill_final_v1';
function readJSON(key){ try { var r = localStorage.getItem(key); return r ? JSON.parse(r) : {}; } catch(e){ return {}; } }
function writeJSON(key, v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch(e){} }
function courseCompleted(){ return isLessonCompleted(LECTURES.length); }

function testForm(mode){
  var qs = TEST.map(function(t, i){
    var opts = testOrder(i).map(function(orig, p){
      var id = 'q' + i + '_' + p;
      return '<label class="q-opt" for="' + id + '">' +
        '<input type="radio" id="' + id + '" name="q' + i + '" value="' + orig + '">' +
        '<span>' + esc(t.a[orig]) + '</span></label>';
    }).join('');
    return '<fieldset class="q-card" data-q="' + i + '">' +
      '<legend><span class="q-num">' + (i + 1) + ' / ' + TEST.length + '</span>' + esc(t.q) + '</legend>' +
      opts + '</fieldset>';
  }).join('');
  return '<form class="test-form" data-test-mode="' + mode + '" novalidate>' + qs +
    '<p class="field-error" data-error="test" role="alert"></p>' +
    '<button type="submit" class="btn btn-primary btn-lg">' + (mode === 'exit' ? 'Завершить итоговый тест' : 'Завершить входной тест') + '</button>' +
    '</form>';
}

function scoreByLesson(answers){
  var by = {};
  TEST.forEach(function(t, i){
    by[t.l] = by[t.l] || { ok:0, total:0 };
    by[t.l].total++;
    if(answers[i] === 0) by[t.l].ok++;
  });
  return by;
}

function resultCard(title, r){
  var by = scoreByLesson(r.answers || []);
  var rows = Object.keys(by).map(function(l){
    return '<li><span>Урок ' + l + '</span><strong>' + by[l].ok + ' из ' + by[l].total + '</strong></li>';
  }).join('');
  return '<div class="result-card">' +
    '<p class="result-title">' + title + '</p>' +
    '<p class="result-score">' + r.score + ' <span>из ' + TEST.length + '</span></p>' +
    '<p class="result-level">' + testLevel(r.score) + '</p>' +
    '<ul class="result-by">' + rows + '</ul>' +
  '</div>';
}

function answerKey(r){
  return '<ol class="key-list">' + TEST.map(function(t, i){
    var mine = (r.answers || [])[i];
    var ok = mine === 0;
    return '<li class="' + (ok ? 'is-ok' : 'is-bad') + '"><p class="key-q">' + esc(t.q) + '</p>' +
      '<p><strong>Правильно:</strong> ' + esc(t.a[0]) + '</p>' +
      (ok ? '' : '<p><strong>Ваш ответ:</strong> ' + (typeof mine === 'number' ? esc(t.a[mine]) : 'нет ответа') + '</p>') +
      '<p class="key-e">' + esc(t.e) + ' (урок ' + t.l + ')</p></li>';
  }).join('') + '</ol>';
}

function renderTest(){
  var data = readJSON(TESTS_KEY);
  var head = '<section class="page-head reveal">' +
    '<h1 class="page-title">Входной и итоговый тест</h1>' +
    '<p class="page-lead">' + TEST.length + ' вопросов по материалам пяти уроков, около 5 минут. Входной тест проходите до первого урока: он покажет стартовый уровень. ' +
    'После урока 5 откроется итоговый тест с теми же вопросами, и вы увидите свой прирост. Ответы хранятся только в вашем браузере.</p>' +
  '</section>';

  if(!data.entry){
    return head + '<section class="reveal"><div class="note-card">Не угадывайте: если не знаете ответа, выберите самый правдоподобный вариант. Правильные ответы откроются после итогового теста.</div>' +
      testForm('entry') + '</section>';
  }

  var html = head + '<section class="reveal"><div class="result-grid">' + resultCard('Входной тест', data.entry) +
    (data.exit ? resultCard('Итоговый тест', data.exit) : '') + '</div>';

  if(data.exit){
    var diff = data.exit.score - data.entry.score;
    html += '<div class="note-card">Прирост: <strong>' + (diff > 0 ? '+' : '') + diff + '</strong> ' + plural(Math.abs(diff), 'балл', 'балла', 'баллов') +
      '. Эти цифры понадобятся в <a href="#/final">курсовой работе</a>.</div>' +
      '<h2 class="section-title key-title">Разбор ответов итогового теста</h2>' + answerKey(data.exit);
  } else if(courseCompleted()){
    html += '<h2 class="section-title key-title">Итоговый тест</h2>' + testForm('exit');
  } else {
    html += '<div class="note-card">Итоговый тест откроется после прохождения урока 5. Тогда же станут видны правильные ответы.</div>' +
      '<a class="btn btn-primary" href="#/lecture/1">Перейти к урокам</a>';
  }
  return html + '</section>';
}

function plural(n, one, few, many){
  var m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

function submitTest(form){
  var mode = form.dataset.testMode === 'exit' ? 'exit' : 'entry';
  var answers = [], missing = 0;
  TEST.forEach(function(t, i){
    var checked = form.querySelector('input[name="q' + i + '"]:checked');
    if(checked){ answers.push(parseInt(checked.value, 10)); }
    else { answers.push(null); missing++; }
    var card = form.querySelector('[data-q="' + i + '"]');
    if(card) card.classList.toggle('is-missing', !checked);
  });
  var err = form.querySelector('[data-error="test"]');
  if(missing){
    if(err) err.textContent = 'Ответьте на все вопросы: осталось ' + missing + '.';
    var first = form.querySelector('.is-missing');
    if(first) first.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  var data = readJSON(TESTS_KEY);
  if(mode === 'exit' && (!data.entry || !courseCompleted())) return;
  if(mode === 'entry' && data.entry) return;
  data[mode] = { score: answers.filter(function(a){ return a === 0; }).length, answers: answers, at: Date.now() };
  writeJSON(TESTS_KEY, data);
  router();
  showToast(mode === 'exit' ? 'Итоговый тест сохранён' : 'Входной тест сохранён');
}

function readCalcForm(){
  var form = document.getElementById('final-calc');
  if(!form) return readJSON(FINAL_KEY);
  function num(el, max){
    if(!el || el.value === '') return null;
    var n = Number(el.value);
    if(!isFinite(n) || n < 0) return null;
    return Math.min(Math.round(n), max);
  }
  var tasks = [0,1,2].map(function(i){
    var row = form.querySelector('[data-task="' + i + '"]');
    return {
      name: (row.querySelector('[data-f="name"]').value || '').slice(0, 80),
      before: num(row.querySelector('[data-f="before"]'), 600),
      after: num(row.querySelector('[data-f="after"]'), 600),
      edits: num(row.querySelector('[data-f="edits"]'), 50)
    };
  });
  var sel = form.querySelector('[data-f="passed"]');
  var passed = sel && sel.value !== '' ? parseInt(sel.value, 10) : null;
  return { tasks: tasks, passed: passed };
}

function calcMetrics(f){
  var tasks = (f.tasks || []).filter(function(t){ return t && t.before !== null && t.before !== undefined && t.after !== null && t.after !== undefined; });
  var complete = tasks.length === 3;
  var before = tasks.reduce(function(s, t){ return s + t.before; }, 0);
  var after = tasks.reduce(function(s, t){ return s + t.after; }, 0);
  var edits = (f.tasks || []).reduce(function(s, t){ return s + (t && typeof t.edits === 'number' ? t.edits : 0); }, 0);
  var tests = readJSON(TESTS_KEY);
  return {
    complete: complete,
    before: before, after: after,
    saving: complete && before > 0 ? Math.round((before - after) / before * 1000) / 10 : null,
    edits: complete ? Math.round(edits / 3 * 10) / 10 : null,
    reliability: typeof f.passed === 'number' ? f.passed * 20 : null,
    entry: tests.entry ? tests.entry.score : null,
    exit: tests.exit ? tests.exit.score : null
  };
}

function fmt(v, suffix){ return v === null ? '—' : String(v).replace('.', ',') + (suffix || ''); }

function calcOutput(){
  var m = calcMetrics(readJSON(FINAL_KEY));
  var growth = (m.entry !== null && m.exit !== null) ? (m.exit - m.entry > 0 ? '+' : '') + (m.exit - m.entry) : '—';
  return '<div class="metric-grid">' +
    '<div class="metric"><p class="metric-name">Время до → после</p><p class="metric-value">' + (m.complete ? m.before + ' → ' + m.after + ' мин' : '—') + '</p></div>' +
    '<div class="metric"><p class="metric-name">Экономия времени</p><p class="metric-value">' + fmt(m.saving, '%') + '</p></div>' +
    '<div class="metric"><p class="metric-name">Правки на задачу</p><p class="metric-value">' + fmt(m.edits) + '</p></div>' +
    '<div class="metric"><p class="metric-name">Надёжность ассистента</p><p class="metric-value">' + fmt(m.reliability, '%') + '</p></div>' +
    '<div class="metric"><p class="metric-name">Тест: вход → итог</p><p class="metric-value">' + (m.entry === null ? '—' : m.entry) + ' → ' + (m.exit === null ? '—' : m.exit) + ' (' + growth + ')</p></div>' +
  '</div>' + (m.complete ? '' : '<p class="hint">Заполните минуты «вручную» и «с ассистентом» для всех трёх задач.</p>');
}

function reportText(){
  var f = readJSON(FINAL_KEY), m = calcMetrics(f);
  var lines = ['Курсовая работа «Нейронавык»: замеры', ''];
  (f.tasks || []).forEach(function(t, i){
    if(!t) return;
    lines.push('Задача ' + (i + 1) + (t.name ? ' (' + t.name + ')' : '') + ': вручную ' + (t.before === null || t.before === undefined ? '—' : t.before) +
      ' мин, с ассистентом ' + (t.after === null || t.after === undefined ? '—' : t.after) + ' мин, правок ' + (typeof t.edits === 'number' ? t.edits : '—'));
  });
  lines.push('');
  lines.push('Экономия времени: ' + fmt(m.saving, '%'));
  lines.push('Правки на задачу: ' + fmt(m.edits));
  lines.push('Надёжность ассистента: ' + fmt(m.reliability, '%') + (typeof f.passed === 'number' ? ' (' + f.passed + ' из 5 тестов)' : ''));
  lines.push('Входной тест: ' + (m.entry === null ? '—' : m.entry + ' из ' + TEST.length) + ', итоговый: ' + (m.exit === null ? '—' : m.exit + ' из ' + TEST.length));
  return lines.join('\n');
}

function copyText(text, okMsg){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove();
    showToast(ok ? (okMsg || 'Отчёт скопирован') : 'Не удалось скопировать: выделите текст вручную');
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){ showToast(okMsg || 'Отчёт скопирован'); }, fallback);
  } else { fallback(); }
}

/* ---------- 15. Роутинг ---------- */
function parseHash(){
  // #/legal#privacy: вторая решётка это якорь раздела, а не часть маршрута
  var raw = location.hash.replace(/^#\/?/, '').split('#')[0].replace(/\/+$/, '');
  if(!raw) return { name:'home' };
  var parts = raw.split('/');
  if(parts[0] === 'lecture'){
    var id = Number(parts[1]);
    if(Number.isInteger(id) && id >= 1 && id <= LECTURES.length) return { name:'lecture', id:id };
  }
  if(parts[0] === 'about' || parts[0] === 'legal' || parts[0] === 'test' || parts[0] === 'final') return { name:parts[0] };
  return { name:'home' };
}

function updateNav(route){
  document.querySelectorAll('[data-nav]').forEach(function(link){
    var active = link.dataset.nav === route.name;
    link.classList.toggle('is-active', active);
  });
}

var TITLES = {
  home:'Нейронавык: бесплатный курс «ИИ в продажах»',
  about:'О курсе · Нейронавык',
  legal:'Правовые документы · Нейронавык',
  test:'Входной и итоговый тест · Нейронавык',
  final:'Курсовая работа · Нейронавык'
};
var firstRender = true;
function router(){
  var route = parseHash();
  updateNav(route);

  if(route.name === 'lecture'){
    var lecture = LECTURES.find(function(l){ return l.id === route.id; });
    if(!isLessonUnlocked(route.id)){
      appEl.innerHTML = renderLocked(route);
      document.title = 'Урок ' + route.id + ' закрыт · Нейронавык';
    } else {
      appEl.innerHTML = renderLecture(route);
      document.title = lecture.title + ' · Нейронавык';
      // Авто-отметка «просмотрена» по окончании видео; если файла нет, показываем заглушку
      appEl.querySelectorAll('video').forEach(function(v){
        v.addEventListener('ended', function(){ markWatched(route.id); });
        var src = v.querySelector('source');
        if(src){
          src.addEventListener('error', function(){
            if(v.dataset.fallback) return;
            v.dataset.fallback = '1';
            var box = v.closest('.video-frame') || v;
            var show = function(exists){
              if(!box.isConnected) return;
              box.outerHTML = exists
                ? placeholderHtml('Не удалось воспроизвести видео', 'Обновите страницу или откройте сайт в другом браузере (Chrome, Safari, Яндекс Браузер).', true)
                : placeholderHtml('Видео скоро появится', 'Урок появится здесь после публикации.', true);
            };
            // Файл есть, но браузер не смог его воспроизвести, или файла ещё нет
            if(window.fetch && location.protocol !== 'file:'){
              fetch(src.getAttribute('src'), { method:'HEAD' }).then(function(r){ show(r.ok); }, function(){ show(false); });
            } else { show(false); }
          });
        }
      });
    }
  } else if(route.name === 'about'){
    appEl.innerHTML = renderAbout();
  } else if(route.name === 'legal'){
    appEl.innerHTML = renderLegal();
  } else if(route.name === 'test'){
    appEl.innerHTML = renderTest();
  } else if(route.name === 'final'){
    appEl.innerHTML = renderFinal();
  } else {
    appEl.innerHTML = renderHome();
  }
  if(TITLES[route.name]) document.title = TITLES[route.name];

  setupReveal();
  // Якорь раздела (#/legal#privacy) прокручиваем после сброса прокрутки, иначе он теряется
  var subAnchor = location.hash.split('#')[2];
  var targetEl = subAnchor ? document.getElementById(subAnchor) : null;
  if(targetEl){
    targetEl.classList.add('in-view');
    targetEl.scrollIntoView({ block:'start' });
  } else {
    window.scrollTo(0, 0);
  }
  // Доступность: после перехода фокус на заголовок новой страницы (кроме первой загрузки)
  if(!firstRender){
    var h1 = appEl.querySelector('h1');
    if(h1){ h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll:true }); }
  }
  firstRender = false;
}

/* ---------- 16. Reveal ---------- */
function setupReveal(){
  var els = appEl.querySelectorAll('.reveal:not(.in-view)');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    els.forEach(function(el){ el.classList.add('in-view'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('in-view');
        io.unobserve(entry.target);
      }
    });
  }, { threshold:0.12 });
  els.forEach(function(el){ io.observe(el); });
}

  var p = getProgress(lecture.id), s = statusFor(lecture);

}

function setSurveyError(field, message){
  var el = document.querySelector('[data-error="' + field + '"]');
  if(el) el.textContent = message || '';
}

function submitSurvey(id){
  var section = document.querySelector('[data-survey="' + id + '"]');
  if(!section) return;
  var rating = section.querySelectorAll('.star.is-active').length;
  var difficultyEl = section.querySelector('.seg.is-active');
  var difficulty = difficultyEl ? difficultyEl.dataset.seg : '';
  var consentEl = section.querySelector('[data-survey-input="consent"]');
  var consent = consentEl ? consentEl.checked : false;

  setSurveyError('rating', rating ? '' : 'Пожалуйста, оцените полезность урока звёздами.');
  setSurveyError('difficulty', difficulty ? '' : 'Пожалуйста, отметьте сложность материала.');
  setSurveyError('consent', consent ? '' : 'Пожалуйста, отметьте, что ознакомились с условием.');

  if(!rating || !difficulty || !consent) return;

  var hardChips = section.querySelectorAll('.chip.is-selected');
  var hard = Array.from(hardChips).map(function(c){ return c.dataset.chip; });
  var liked = section.querySelector('[data-survey-input="liked"]').value.trim();
  var unclear = section.querySelector('[data-survey-input="unclear"]').value.trim();

  saveSurvey(id, {
    rating: rating,
    difficulty: difficulty,
    hard: hard,
    liked: liked,
    unclear: unclear,
    submittedAt: Date.now()
  });

  var wrapper = document.createElement('div');
  wrapper.innerHTML = surveySuccessHtml(id, true);
  if(section.parentNode) section.parentNode.replaceChild(wrapper.firstChild, section);
  var title = document.getElementById('survey-title');
  if(title) title.focus();

  updateLectureUI(parseHash());
}

/* ---------- 20. Radio-группы: клавиатура ---------- */
function setGroupSelection(group, activeEl){
  var items = Array.prototype.slice.call(group.querySelectorAll('[role="radio"]'));
  items.forEach(function(item){
    var active = item === activeEl;
    item.setAttribute('aria-checked', String(active));
    item.tabIndex = active ? 0 : -1;
  });
}
function moveGroupFocus(group, dir){
  var items = Array.prototype.slice.call(group.querySelectorAll('[role="radio"]'));
  var idx = items.indexOf(document.activeElement);
  if(idx === -1) idx = items.findIndex(function(i){ return i.getAttribute('aria-checked') === 'true'; });
  if(idx === -1) idx = 0;
  var next = (idx + dir + items.length) % items.length;
  items[next].focus();
  setGroupSelection(group, items[next]);
}

  if(!METRIKA_ID || METRIKA_LOADED) return;

  (function(m,e,t,r,i,k,a){ m[i] = m[i] || function(){ (m[i].a = m[i].a || []).push(arguments); }; m[i].l = 1 * new Date();
    k = e.createElement(t); a = e.getElementsByTagName(t)[0]; k.async = 1; k.src = r; a.parentNode.insertBefore(k, a); })
    (window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=' + METRIKA_ID, 'ym');
  window.ym(Number(METRIKA_ID), 'init', { clickmap:false, trackLinks:false, accurateTrackBounce:false, webvisor:false, trackHash:true });
}
function clearMetrikaCookies(){
  var host = location.hostname, parts = host.split('.'), domains = [host, '.' + host];
  if(parts.length > 2) domains.push('.' + parts.slice(-2).join('.'));
  document.cookie.split(';').forEach(function(c){
    var name = c.split('=')[0].trim();
    if(name.indexOf('_ym') !== 0 && name !== 'yabs-sid' && name !== 'ymex') return;
    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
    domains.forEach(function(d){ document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + d; });
  });
}
function setCookieConsent(value){
  try { localStorage.setItem(COOKIE_KEY, value); } catch(e){}
  hideCookieBanner();
  if(value === 'accepted'){ loadMetrika(); }
  else {
    clearMetrikaCookies();
    if(METRIKA_LOADED){ location.reload(); }
  }
}
function resetCookieChoice(){
  clearMetrikaCookies();
  try { localStorage.removeItem(COOKIE_KEY); } catch(e){}

}

function showToast(text){
  var old = document.querySelector('.toast');
  if(old) old.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ t.remove(); }, 300);
  }, 3500);
}

  if(!(t instanceof Element) || !t.matches('.mat-tab')) return;
  var keys = { ArrowRight:1, ArrowLeft:-1 };
  if(!(e.key in keys)) return;
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.mat-tab'));
  var next = tabs[(tabs.indexOf(t) + keys[e.key] + tabs.length) % tabs.length];
  e.preventDefault(); activateMatTab(next.dataset.mtab); next.focus();
});
document.addEventListener('click', function(e){
  if(!(e.target instanceof Element)) return;

  // Ссылка «Перейти к содержимому» не должна менять маршрут
  if(e.target.closest('[data-action="skip"]')){
    e.preventDefault();
    var mainEl = document.getElementById('main');
    if(mainEl){ mainEl.focus(); mainEl.scrollIntoView(); }
    return;
  }

  if(e.target.closest('[data-action="cookie-reset"]')){
    e.preventDefault();
    resetCookieChoice();
    return;
  }

  var copyBtn = e.target.closest('[data-action="copy-report"]');
  if(copyBtn){
    e.preventDefault();
    copyText(reportText());
    return;
  }

  var cookieBtn = e.target.closest('[data-cookie]');
  if(cookieBtn){
    e.preventDefault();
    setCookieConsent(cookieBtn.dataset.cookie === 'accept' ? 'accepted' : 'declined');
    return;
  }

  // Удаление данных (пункт 20): двухшаговое подтверждение
  var delBtn = e.target.closest('[data-action="delete-data"]');
  if(delBtn){
    e.preventDefault();
    if(delBtn.dataset.confirm === 'yes'){
      deleteAllData();
      delBtn.dataset.confirm = '';
      delBtn.textContent = 'Удалить мои данные';
      var st = document.getElementById('delete-status');
      if(st) st.textContent = 'Данные удалены. Курс начнётся заново.';
      showToast('Все ваши данные удалены');
      router();
    } else {
      delBtn.dataset.confirm = 'yes';
      delBtn.textContent = 'Точно удалить? Нажмите ещё раз';
      setTimeout(function(){
        if(delBtn.dataset.confirm === 'yes'){
          delBtn.dataset.confirm = '';
          delBtn.textContent = 'Удалить мои данные';
        }
      }, 4000);
    }
    return;
  }

  var watchedBtn = e.target.closest('[data-action="mark-watched"]');
  if(watchedBtn){
    e.preventDefault();
    var id = parseInt(watchedBtn.dataset.id, 10);
    toggleWatched(id);
    updateLectureUI(parseHash());
    var survey = document.querySelector('[data-survey="' + id + '"]');
    if(survey && !getProgress(id).survey){
      survey.scrollIntoView({ behavior:'smooth', block:'center' });
      survey.classList.remove('attention');
      void survey.offsetWidth;
      survey.classList.add('attention');
    }
    return;
  }

  var hwBtn = e.target.closest('[data-action="mark-homework"]');
  if(hwBtn){
    e.preventDefault();
    toggleHomeworkDone(parseInt(hwBtn.dataset.id, 10));
    updateLectureUI(parseHash());
    return;
  }

  var mTab = e.target.closest('[data-mtab]');
  if(mTab){
    e.preventDefault();
    activateMatTab(mTab.dataset.mtab);
    return;
  }

  var cpBtn = e.target.closest('[data-action="copy-prompt"]');
  if(cpBtn){
    e.preventDefault();
    var mat = MATERIALS[parseInt(cpBtn.dataset.lesson, 10)];
    var pr = mat && mat.prompts[parseInt(cpBtn.dataset.idx, 10)];
    if(pr) copyText(pr.text, 'Запрос скопирован');
    return;
  }

  var rsBtn = e.target.closest('[data-action="mat-reset"]');
  if(rsBtn){
    e.preventDefault();
    var rid = parseInt(rsBtn.dataset.lesson, 10), all = loadChecks();
    delete all[rid]; saveChecks(all);
    document.querySelectorAll('.mat-check input').forEach(function(i){ i.checked = false; i.closest('.mat-check').classList.remove('is-on'); });
    updateMatProgress(rid);
    return;
  }

  var tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){
    e.preventDefault();
    activateTab(tabBtn.dataset.tab);
    return;
  }

  var star = e.target.closest('.star');
  if(star){
    e.preventDefault();
    var group = star.closest('.stars');
    var value = parseInt(star.dataset.star, 10);
    group.querySelectorAll('.star').forEach(function(s){
      var active = parseInt(s.dataset.star, 10) <= value;
      s.classList.toggle('is-active', active);
      s.setAttribute('aria-checked', String(active));
    });
    setGroupSelection(group, star);
    setSurveyError('rating', '');
    return;
  }

  var seg = e.target.closest('.seg');
  if(seg){
    e.preventDefault();
    var group2 = seg.closest('.seg-group');
    group2.querySelectorAll('.seg').forEach(function(s){
      var active = s === seg;
      s.classList.toggle('is-active', active);
      s.setAttribute('aria-checked', String(active));
    });
    setGroupSelection(group2, seg);
    setSurveyError('difficulty', '');
    return;
  }

  var chip = e.target.closest('.chip');
  if(chip){
    e.preventDefault();
    chip.classList.toggle('is-selected');
    return;
  }

  var surveyBtn = e.target.closest('[data-action="submit-survey"]');
  if(surveyBtn){
    e.preventDefault();
    submitSurvey(parseInt(surveyBtn.dataset.id, 10));
  }
});

document.addEventListener('keydown', function(e){
  if(!(e.target instanceof Element)) return;
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var group = e.target.closest('[role="radiogroup"]');
  if(!group) return;
  e.preventDefault();
  moveGroupFocus(group, e.key === 'ArrowRight' ? 1 : -1);
});

document.addEventListener('submit', function(e){
  var form = e.target;
  if(form && form.classList && form.classList.contains('test-form')){
    e.preventDefault();
    submitTest(form);
  } else if(form && form.id === 'final-calc'){
    e.preventDefault();
  }
});

document.addEventListener('input', function(e){
  if(!(e.target instanceof Element)) return;
  if(e.target.closest('#final-calc')){
    writeJSON(FINAL_KEY, readCalcForm());
    var out = document.getElementById('calc-out');
    if(out) out.innerHTML = calcOutput();
  }
  var card = e.target.closest('.q-card');
  if(card) card.classList.remove('is-missing');
});
document.addEventListener('change', function(e){
  if(e.target instanceof Element && e.target.closest('#final-calc')){
    writeJSON(FINAL_KEY, readCalcForm());
    var out = document.getElementById('calc-out');
    if(out) out.innerHTML = calcOutput();
  }
});

window.addEventListener('hashchange', router);

/* ---------- 24. Запуск ---------- */
router();
showCookieBanner();
try { if(localStorage.getItem(COOKIE_KEY) === 'accepted') loadMetrika(); } catch(e){}
})();
</script>
</body>
</html>
